<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgGrad_E-COMMERCE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bgGrad_E-COMMERCE)" rx="16" />
  
  <!-- Browser Window Mockup -->
  <rect x="40" y="30" width="520" height="250" rx="14" fill="rgba(15, 23, 42, 0.72)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" />
  
  <circle cx="65" cy="52" r="5" fill="#ef4444" />
  <circle cx="82" cy="52" r="5" fill="#f59e0b" />
  <circle cx="99" cy="52" r="5" fill="#10b981" />
  <rect x="125" y="44" width="240" height="16" rx="4" fill="rgba(255, 255, 255, 0.1)" />
  <rect x="440" y="43" width="95" height="20" rx="6" fill="#253ca7" />
  <text x="487" y="57" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">E-COMMERCE</text>

  <text x="65" y="108" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold">E-Commerce Marketplace</text>
  <text x="65" y="132" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Modern Storefront & Multi-Gateway</text>

  <!-- Visual Elements / Charts -->
  <g transform="translate(65, 155)">
    <!-- Card 1: Metric Bars -->
    <rect x="0" y="0" width="130" height="95" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.1)" />
    <rect x="18" y="45" width="16" height="40" rx="3" fill="#38bdf8" />
    <rect x="44" y="20" width="16" height="65" rx="3" fill="#818cf8" />
    <rect x="70" y="32" width="16" height="53" rx="3" fill="#253ca7" />
    <rect x="96" y="15" width="16" height="70" rx="3" fill="#38bdf8" />

    <!-- Card 2: Trend Line -->
    <rect x="150" y="0" width="170" height="95" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.1)" />
    <path d="M 165 70 Q 200 20 235 50 T 305 25" fill="none" stroke="#38bdf8" stroke-width="3" />
    <circle cx="305" cy="25" r="4" fill="#ffffff" />
    <text x="165" y="85" fill="#94a3b8" font-family="sans-serif" font-size="10">+48% Efficiency</text>

    <!-- Card 3: Donut Progress -->
    <rect x="340" y="0" width="130" height="95" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.1)" />
    <circle cx="405" cy="48" r="28" fill="none" stroke="#334155" stroke-width="7" />
    <circle cx="405" cy="48" r="28" fill="none" stroke="#38bdf8" stroke-width="7" stroke-dasharray="135 180" stroke-linecap="round" />
    <text x="405" y="52" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">98%</text>
  </g>
  
  <!-- Footer Pills -->
  <rect x="40" y="295" width="130" height="22" rx="6" fill="rgba(255, 255, 255, 0.08)" />
  <rect x="185" y="295" width="110" height="22" rx="6" fill="rgba(255, 255, 255, 0.08)" />
  <rect x="310" y="295" width="140" height="22" rx="6" fill="rgba(255, 255, 255, 0.08)" />
